name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer:
    name: Build ${{ matrix.arch }} installer
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runtime: win-x64
            platform: x64
            allowed_arch: x64compatible
            install_mode: x64compatible
          - arch: arm64
            runtime: win-arm64
            platform: arm64
            allowed_arch: arm64
            install_mode: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Publish and create installer
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          RUNTIME: ${{ matrix.runtime }}
          PLATFORM: ${{ matrix.platform }}
          ALLOWED_ARCH: ${{ matrix.allowed_arch }}
          INSTALL_MODE: ${{ matrix.install_mode }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([.-].*)?$') {
            throw "Release tag '$env:GITHUB_REF_NAME' must use vMAJOR.MINOR.PATCH format."
          }

          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/$env:RUNTIME"
          $installerDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/installers"
          New-Item -ItemType Directory -Force -Path $publishDir, $installerDir | Out-Null

          dotnet publish src/UltimateWinUI/UltimateWinUI.csproj `
            --configuration Release `
            --runtime $env:RUNTIME `
            --self-contained true `
            -p:Platform=$env:PLATFORM `
            -p:Version=$version `
            --output $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc `
            "/DAppVersion=$version" `
            "/DPublishDir=$publishDir" `
            "/DOutName=UltimateWinUI-$env:ARCH-Setup-$version" `
            "/DArchAllowed=$env:ALLOWED_ARCH" `
            "/DIn64Bit=$env:INSTALL_MODE" `
            "/O$installerDir" `
            installer/UltimateWinUI.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-installer
          path: artifacts/installers/*.exe
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: artifacts
          merge-multiple: true

      - name: Create release with notes and installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected_x64="UltimateWinUI-x64-Setup-${version}.exe"
          expected_arm64="UltimateWinUI-arm64-Setup-${version}.exe"
          mapfile -t installers < <(find artifacts -maxdepth 1 -type f -name '*.exe' -printf '%f\n' | sort)

          if [[ "${installers[*]}" != "${expected_arm64} ${expected_x64}" ]]; then
            printf 'Expected exactly %s and %s; found: %s\n' \
              "$expected_x64" "$expected_arm64" "${installers[*]}" >&2
            exit 1
          fi

          if previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" --match 'v[0-9]*' 2>/dev/null); then
            commit_range="${previous_tag}..${GITHUB_REF_NAME}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}"
          else
            commit_range="$GITHUB_REF_NAME"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          fi

          changes=$(git log --no-merges --format='- %s (%h)' "$commit_range")
          if [[ -z "$changes" ]]; then
            changes='- No non-merge commits in this release range.'
          fi

          {
            printf '# UltimateWinUI %s\n\n' "$GITHUB_REF_NAME"
            printf '## Changes\n\n%s\n\n' "$changes"
            printf '**Full Changelog:** %s\n' "$compare_url"
          } > release-notes.md

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "UltimateWinUI $GITHUB_REF_NAME" \
              --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" \
              "artifacts/$expected_x64" \
              "artifacts/$expected_arm64" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "artifacts/$expected_x64" \
              "artifacts/$expected_arm64" \
              --repo "$GITHUB_REPOSITORY" \
              --title "UltimateWinUI $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
